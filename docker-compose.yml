services:
  spese:
    build: .
    image: emailpagamenti:ultima
    container_name: spese
    restart: unless-stopped

    ports:
      # Sulla LAN di casa basta questa. Per raggiungerla da fuori, mettere davanti
      # un reverse proxy con certificato e accendere Security__RequireHttps.
      - "8080:8080"

    environment:
      # --- Accesso all'interfaccia ---
      Security__Password: ${SPESE_PASSWORD:?serve SPESE_PASSWORD nel file .env}
      Security__RequireHttps: ${SPESE_RICHIEDI_HTTPS:-false}

      # --- Casella di posta ---
      Imap__Host: ${IMAP_HOST:?serve IMAP_HOST nel file .env}
      Imap__Port: ${IMAP_PORT:-993}
      Imap__UserName: ${IMAP_UTENTE:?serve IMAP_UTENTE nel file .env}
      Imap__Password: ${IMAP_PASSWORD:?serve IMAP_PASSWORD nel file .env}

      # --- Database ---
      Database__Provider: Sqlite
      ConnectionStrings__Transactions: Data Source=/app/dati/pagamenti.db

      # --- Acquisizione ---
      Ingestion__PollInterval: ${INTERVALLO:-00:15:00}
      Ingestion__InitialLookback: ${STORICO_INIZIALE:-365.00:00:00}

    volumes:
      # Il database vive qui: e' l'unica cosa da salvare nei backup.
      - spese-dati:/app/dati

    # Il servizio non ha bisogno di scrivere altrove ne' di privilegi aggiuntivi.
    read_only: false
    security_opt:
      - no-new-privileges:true

volumes:
  spese-dati:
