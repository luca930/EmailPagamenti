name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build e test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore EmailPagamenti.sln

      - name: Build
        run: dotnet build EmailPagamenti.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EmailPagamenti.sln --configuration Release --no-build --verbosity normal
